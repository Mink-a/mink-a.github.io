name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required repo configuration (Settings → Secrets and variables → Actions):
#   Variables: PUBLIC_INSTANT_APP_ID   (public InstantDB app id, inlined at build)
#   Secrets:   CLOUDFLARE_API_TOKEN    (token with "Cloudflare Pages: Edit")
#              CLOUDFLARE_ACCOUNT_ID
# Cloudflare Pages project secrets (set once via `wrangler pages secret put`):
#   LLM_API_KEY, INSTANT_APP_ADMIN_TOKEN

concurrency:
  group: cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # The resume PDF is generated locally (bun run resume:pdf), never in CI,
          # so skip puppeteer's Chromium download to keep deploys fast.
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: bun run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          # Public, non-secret; baked into the client + worker bundles at build.
          PUBLIC_INSTANT_APP_ID: ${{ vars.PUBLIC_INSTANT_APP_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name + output dir + bindings come from wrangler.jsonc.
          command: pages deploy --branch=main
